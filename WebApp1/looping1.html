<script>
    var n = parseInt(prompt("Enter the n value is::"))
    for (i = 0; i <= n; i++) {
        if (i % 2 == 0) {
            document.write("<br> It is Even" + i)
        }
        else {
            document.write("<br> It is odd" + i)
        }
    }
</script>
